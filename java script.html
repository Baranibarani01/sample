<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document</title>
</head>
<body>
    <script>
        var x = 10;
        let y = '15';
        let z = 20;  // It's better to declare variables with let or const

        console.log(x);
        // The expression uses || and &&, so let's add parentheses to clarify precedence
        console.log((x == y) || (x < z && y >= z));
    </script>
</body>
</html>

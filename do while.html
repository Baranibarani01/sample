<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do While Loop Example</title>
</head>
<body>
  <h1>Do While Loop Output:</h1>
  <div id="output"></div>

  <script>
    let i = 15;
    const outputDiv = document.getElementById('output');

    do {
      outputDiv.innerHTML += i + '<br>';
      i -= 3;
    } while (i >= -9);
  </script>
</body>
</html>
